<!doctype html>
<html lang="en" class="h-full">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" id="dynamic-favicon" />
    <link rel="apple-touch-icon" href="/favicon.svg" id="dynamic-apple-icon" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SwiftStream Telecommunications | Fiber Internet & IT Services</title>
    <script>
      (function() {
        try {
          var raw = localStorage.getItem('swiftstream_business_profile_v4') || localStorage.getItem('swiftstream_business_profile');
          if (raw) {
            var profile = JSON.parse(raw);
            if (profile) {
              if (profile.logoUrl) {
                var icon = document.getElementById('dynamic-favicon');
                if (icon) icon.href = profile.logoUrl;
                var apple = document.getElementById('dynamic-apple-icon');
                if (apple) apple.href = profile.logoUrl;
              }
              if (profile.tradeName || profile.name) {
                document.title = (profile.tradeName || profile.name) + ' | Fiber Internet & Billing';
              }
            }
          }
        } catch (e) {}
      })();
    </script>
    <!-- Google Fonts Inter & JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  </head>
  <body class="h-full bg-slate-900 text-slate-100 font-sans antialiased selection:bg-cyan-500 selection:text-white">
    <div id="root" class="h-full"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
